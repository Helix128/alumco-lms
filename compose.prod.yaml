services:
    app:
        build:
            context: .
            dockerfile: docker/8.4-trixie/Dockerfile
            target: production
        image: 'alumco-lms-app:8.4-trixie'
        restart: unless-stopped
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: '${APP_KEY}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            CACHE_STORE: '${CACHE_STORE:-redis}'
            APP_MAINTENANCE_DRIVER: cache
            APP_MAINTENANCE_STORE: redis
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
            RUN_SEEDERS: '${RUN_SEEDERS:-true}'
            RUN_STORAGE_LINK: '${RUN_STORAGE_LINK:-true}'
            RUN_LARAVEL_OPTIMIZE: '${RUN_LARAVEL_OPTIMIZE:-true}'
            MEDIA_DISK: '${MEDIA_DISK:-local_media}'
            MEDIA_LOCAL_ROOT: /var/www/media
            MEDIA_TEMP_ROOT: /var/www/media-temp
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PASSWORD: 'null'
            REDIS_PORT: 6379
        volumes:
            # Cargamos el .env de producción para que Laravel tenga la configuración correcta
            - ./.env:/var/www/html/.env
            - prod-media:/var/www/media
            - prod-media-temp:/var/www/media-temp
        networks:
            - alumco-prod
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
    queue:
        build:
            context: .
            dockerfile: docker/8.4-trixie/Dockerfile
            target: production
        image: 'alumco-lms-app:8.4-trixie'
        restart: unless-stopped
        command: php artisan queue:work --tries=3 --sleep=3 --timeout=90
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: '${APP_KEY}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            CACHE_STORE: '${CACHE_STORE:-redis}'
            APP_MAINTENANCE_DRIVER: cache
            APP_MAINTENANCE_STORE: redis
            RUN_MIGRATIONS: 'false'
            RUN_SEEDERS: 'false'
            RUN_STORAGE_LINK: 'false'
            RUN_LARAVEL_OPTIMIZE: 'false'
            MEDIA_DISK: '${MEDIA_DISK:-local_media}'
            MEDIA_LOCAL_ROOT: /var/www/media
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PASSWORD: 'null'
            REDIS_PORT: 6379
        volumes:
            - ./.env:/var/www/html/.env
            - prod-media:/var/www/media
        networks:
            - alumco-prod
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: docker/8.4-trixie/Dockerfile
            target: production
        image: 'alumco-lms-app:8.4-trixie'
        restart: unless-stopped
        command: >
            sh -c "while true; do
            php artisan schedule:run --no-interaction;
            sleep 60;
            done"
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: '${APP_KEY}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            CACHE_STORE: '${CACHE_STORE:-redis}'
            APP_MAINTENANCE_DRIVER: cache
            APP_MAINTENANCE_STORE: redis
            RUN_MIGRATIONS: 'false'
            RUN_SEEDERS: 'false'
            RUN_STORAGE_LINK: 'false'
            RUN_LARAVEL_OPTIMIZE: 'false'
            MEDIA_DISK: '${MEDIA_DISK:-local_media}'
            MEDIA_LOCAL_ROOT: /var/www/media
            MEDIA_TEMP_ROOT: /var/www/media-temp
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PASSWORD: 'null'
            REDIS_PORT: 6379
        volumes:
            - ./.env:/var/www/html/.env
            - prod-media:/var/www/media
            - prod-media-temp:/var/www/media-temp
        networks:
            - alumco-prod
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    media-worker:
        build:
            context: .
            dockerfile: docker/8.4-trixie/Dockerfile
            target: media-worker
        image: 'alumco-lms-media:8.4-trixie'
        restart: unless-stopped
        command: php artisan queue:work --queue=media --tries=2 --sleep=3 --timeout=3600 --max-jobs=25
        cpus: '2.0'
        mem_limit: 2g
        environment:
            APP_ENV: production
            APP_DEBUG: false
            APP_KEY: '${APP_KEY}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:-redis}'
            CACHE_STORE: '${CACHE_STORE:-redis}'
            RUN_MIGRATIONS: 'false'
            RUN_SEEDERS: 'false'
            RUN_STORAGE_LINK: 'false'
            RUN_LARAVEL_OPTIMIZE: 'false'
            MEDIA_DISK: '${MEDIA_DISK:-local_media}'
            MEDIA_LOCAL_ROOT: /var/www/media
            MEDIA_TEMP_ROOT: /var/www/media-temp
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            REDIS_HOST: redis
            REDIS_PASSWORD: 'null'
            REDIS_PORT: 6379
        volumes:
            - ./.env:/var/www/html/.env
            - prod-media:/var/www/media
            - prod-media-temp:/var/www/media-temp
        networks:
            - alumco-prod
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Servidor web (Nginx)
    web:
        build:
            context: .
            dockerfile: docker/8.4-trixie/Dockerfile
            target: web
        image: 'alumco-lms-web:8.4-trixie'
        restart: unless-stopped
        ports:
            # Exponemos la app en el puerto 8080
            - '${DOCKER_HOST_BIND:-127.0.0.1}:${APP_PORT:-8080}:80'
        networks:
            - alumco-prod
        volumes:
            - prod-media:/var/www/media:ro
        depends_on:
            - app

    # Base de datos (MySQL)
    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            # Eliminamos MYSQL_ALLOW_EMPTY_PASSWORD por seguridad en producción
        volumes:
            - prod-mysql:/var/lib/mysql
            # No cargamos scripts de testing en producción
        networks:
            - alumco-prod
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
            retries: 3
            timeout: 5s

    # Memoria cache y sistema de colas (Redis)
    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - prod-redis:/data
        networks:
            - alumco-prod
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            retries: 3
            timeout: 5s

networks:
    alumco-prod:
        driver: bridge
        ipam:
            config:
                - subnet: '${DOCKER_PROD_SUBNET:-172.30.250.0/27}'

volumes:
    # Volúmenes persistentes para que tus datos no se borren si el server reinicia
    prod-mysql:
        driver: local
    prod-redis:
        driver: local
    prod-media:
        driver: local
    prod-media-temp:
        driver: local
